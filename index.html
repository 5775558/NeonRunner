<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星际疾跑</title><style>*{box-sizing:border-box}body{margin:0;background:#10182c;color:white;font-family:system-ui;text-align:center;touch-action:none}canvas{display:block;width:min(100vw,56.25vh);height:min(177.78vw,100vh);max-height:100vh;margin:auto;background:#172746}#ui{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-around;font-weight:bold;text-shadow:0 2px 4px #000}#cover{position:fixed;inset:0;background:#071020c9;display:grid;place-items:center}.panel{background:#20375fee;border:1px solid #6ae9e0;border-radius:22px;padding:28px;max-width:340px}button{border:0;border-radius:30px;padding:14px 32px;font-size:18px;font-weight:bold;background:#45dfd2;color:#10213a}h1{font-size:34px;margin:0 0 8px}p{line-height:1.7}</style></head><body><canvas id="c" width="450" height="800"></canvas><div id="ui"><span>🪙 <b id="coin">0</b></span><span>距离 <b id="meter">0</b> m</span><span>纪录 <b id="record">0</b></span></div><div id="cover"><div class="panel"><h1 id="title">星际疾跑</h1><p id="desc">三条跑道，躲避障碍，收集星币！<br>左右滑动换道 · 上滑跳跃 · 下滑翻滚</p><button id="go">开始游戏</button></div></div><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s);let lane=1,y=0,vy=0,slide=0,items=[],tick=0,dist=0,coins=0,speed=7,active=false,best=+(localStorage.runnerBest||0);$('#record').textContent=best;const lx=n=>225+(n-1)*105;function start(){lane=1;y=vy=slide=0;items=[];tick=25;dist=coins=0;speed=7;active=true;$('#coin').textContent=0;$('#meter').textContent=0;$('#cover').style.display='none'}function act(a){if(!active)return;if(a==='l')lane=Math.max(0,lane-1);if(a==='r')lane=Math.min(2,lane+1);if(a==='u'&&y===0)vy=19;if(a==='d')slide=25}function end(){active=false;best=Math.max(best,Math.floor(dist));localStorage.runnerBest=best;$('#record').textContent=best;$('#title').textContent='跑酷结束';$('#desc').innerHTML='距离 '+Math.floor(dist)+' 米 · 星币 '+coins+' 枚<br>再挑战一次，刷新纪录！';$('#go').textContent='重新开始';$('#cover').style.display='grid'}function frame(){g.clearRect(0,0,450,800);let sky=g.createLinearGradient(0,0,0,800);sky.addColorStop(0,'#14284c');sky.addColorStop(1,'#10182c');g.fillStyle=sky;g.fillRect(0,0,450,800);for(let i=0;i<13;i++){let h=90+(i*47%110);g.fillStyle='#20395b';g.fillRect(i*39,390-h,30,h)}g.fillStyle='#202e49';g.beginPath();g.moveTo(150,350);g.lineTo(300,350);g.lineTo(450,800);g.lineTo(0,800);g.fill();g.strokeStyle='#42e8d9';g.lineWidth=3;g.beginPath();g.moveTo(150,350);g.lineTo(0,800);g.moveTo(300,350);g.lineTo(450,800);g.stroke();for(let i=0;i<4;i++){g.beginPath();g.moveTo(150+i*50,350);g.lineTo(i*150,800);g.stroke()}for(let i of items){let yy=350+i.z*450,s=.3+i.z*.8,xx=lx(i.l);if(i.t==='coin'){g.fillStyle='#ffd85b';g.beginPath();g.arc(xx,yy,13*s,0,7);g.fill()}else{g.fillStyle=i.t==='block'?'#ff5575':i.t==='bar'?'#ffbd4a':'#a987ff';g.fillRect(xx-28*s,yy-45*s,56*s,48*s)}}let px=lx(lane),py=680-y;g.fillStyle='#38d9cf';g.fillRect(px-21,py-57,42,56);g.fillStyle='#f2c7a5';g.fillRect(px-17,py-89,34,31);g.fillStyle='#263b64';g.fillRect(px-20,py-96,40,14);if(slide>0){g.fillStyle='#42e8d9';g.fillRect(px-29,py-20,58,24)}if(active){dist+=speed*.035;speed=Math.min(13,7+dist/180);$('#meter').textContent=Math.floor(dist);tick--;if(tick<=0){let l=Math.floor(Math.random()*3),r=Math.random(),t=r<.48?'coin':r<.68?'block':r<.84?'bar':'gate';if(t==='coin'){for(let k=0;k<5;k++)items.push({l,z:-k*.12,t})}else items.push({l,z:0,t});tick=Math.max(25,68-(speed-7)*5)}if(vy||y){y+=vy;vy-=.9;if(y<0)y=vy=0}if(slide>0)slide--;for(let i of items){i.z+=speed/450;if(i.z>.88&&!i.hit){i.hit=true;if(i.l===lane){if(i.t==='coin'){coins++;$('#coin').textContent=coins}else if((i.t==='block'&&y<35)||(i.t==='bar'&&y<45)||(i.t==='gate'&&slide===0)){end();break}}}}items=items.filter(i=>i.z<1.1)}requestAnimationFrame(frame)}$('#go').onclick=start;let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;act(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy<0?'u':'d'))},{passive:true});onkeydown=e=>act(e.key==='ArrowLeft'?'l':e.key==='ArrowRight'?'r':e.key==='ArrowUp'?'u':e.key==='ArrowDown'?'d':'');frame()})();</script></body></html>
