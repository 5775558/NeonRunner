plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neonrunner.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.neonrunner.game"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
